[project]
name = "qa-train-local-runtime"
version = "0.1.0"
description = "Pinned first-run model delivery and local embedding runtime for QA Train"
requires-python = ">=3.12"
dependencies = [
  "huggingface-hub>=1.0,<2",
]

[project.optional-dependencies]
inference = [
  "sentence-transformers>=2.7,<6",
  "transformers>=4.51,<6",
]

[project.scripts]
qa-model = "qa_local_runtime.cli:main"
qa-rules = "qa_local_runtime.rule_pack_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qa_local_runtime"]
